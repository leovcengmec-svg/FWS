
name: FWS V226 Android Validation

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-package:
    name: Validate source ZIP, sync artwork and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate exact V226 Android package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 3 -type f -name 'Football_World_Simulator_V226_ANDROID_FOUNDATION.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo 'Required package Football_World_Simulator_V226_ANDROID_FOUNDATION.zip was not found in the repository.' >&2
            find . -maxdepth 3 -type f -name '*.zip' -print >&2
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using source package: $ZIP"
          echo "Package size: $(stat -c%s "$ZIP") bytes"

      - name: Extract V226 Android package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fws-source"
          unzip -q "${{ steps.package.outputs.zip }}" -d "$RUNNER_TEMP/fws-source"
          WORK="$RUNNER_TEMP/fws-source"
          if [ ! -f "$WORK/android/app/build.gradle" ]; then
            FOUND="$(find "$WORK" -type f -path '*/android/app/build.gradle' -print -quit)"
            if [ -z "$FOUND" ]; then
              echo 'Could not find android/app/build.gradle inside the V226 package.' >&2
              find "$WORK" -maxdepth 5 -type f | head -80 >&2
              exit 1
            fi
            WORK="$(dirname "$(dirname "$(dirname "$(dirname "$FOUND")")")")"
          fi
          echo "FWS_WORK=$WORK" >> "$GITHUB_ENV"
          test -f "$WORK/android/app/src/main/assets/global_world_catalog.json"
          test -f "$WORK/android/app/src/main/assets/identity/verified_assets.json"
          test -f "$WORK/tools/sync_verified_identity_assets.py"
          echo "Validated project root: $WORK"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test and image dependencies
        run: python -m pip install --upgrade pip pytest pillow cairosvg

      - name: Validate identity assets without requiring a clubs directory
        working-directory: ${{ env.FWS_WORK }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          assets = Path('android/app/src/main/assets')
          identity = assets / 'identity'
          catalog = json.loads((assets / 'global_world_catalog.json').read_text(encoding='utf-8'))
          manifest = json.loads((identity / 'verified_assets.json').read_text(encoding='utf-8'))
          flags = identity / 'countries'

          assert assets.is_dir(), f'Missing assets directory: {assets}'
          assert flags.is_dir(), f'Missing country flag directory: {flags}'
          assert isinstance(manifest.get('assets'), dict), 'verified_assets.json must contain an assets mapping'
          assert len(catalog.get('associations', {})) == 211, 'Expected 211 associations in global catalog'

          missing = []
          for entity, relpath in manifest['assets'].items():
              target = assets / relpath
              if not target.is_file():
                  missing.append((entity, str(target)))

          if missing:
              raise SystemExit(
                  'Manifest references missing assets:\n'
                  + '\n'.join(f'{k}: {p}' for k, p in missing[:30])
              )

          print(f'Identity validation passed: {len(manifest["assets"])} mappings; {len(catalog["associations"])} associations.')
          print('No hard-coded identity/clubs directory is required; artwork is tracked through the manifest.')
          PY

      - name: Run Android adapter integration tests
        working-directory: ${{ env.FWS_WORK }}/android
        env:
          PYTHONPATH: app/src/main/python
        run: python -m pytest -q tests/

      - name: Run identity synchronizer tests
        working-directory: ${{ env.FWS_WORK }}
        run: python -m pytest -q tests/test_identity_asset_sync.py

      - name: Compile Python engine and tools
        working-directory: ${{ env.FWS_WORK }}
        run: python -m compileall -q android/app/src/main/python tools tests

      - name: Install image processing dependencies for artwork sync
        run: python -m pip install --upgrade pillow cairosvg

      - name: Sync full catalog artwork on manual run
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ env.FWS_WORK }}
        run: python tools/sync_verified_identity_assets.py --delay 0.22

      - name: Sync priority artwork on push or pull request
        if: github.event_name != 'workflow_dispatch'
        working-directory: ${{ env.FWS_WORK }}
        run: python tools/sync_verified_identity_assets.py --max-searches 500 --delay 0.22

      - name: Record identity asset coverage
        working-directory: ${{ env.FWS_WORK }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('android/app/src/main/assets/identity/asset_sources.json')
          data = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          print(json.dumps({
              'asset_count': len(data.get('assets', {})),
              'summary': data.get('summary', {}),
              'missing_examples': data.get('missing', [])[:20]
          }, ensure_ascii=False, indent=2))
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p "$FWS_WORK/android" --no-daemon assembleDebug

      - name: Verify APK exists and is below 25 MB
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$FWS_WORK/android/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          SIZE="$(stat -c%s "$APK")"
          echo "APK=$APK SIZE_BYTES=$SIZE"
          test "$SIZE" -le 26214400

      - name: Package updated source with synchronized artwork
        shell: bash
        run: |
          set -euo pipefail
          cd "$FWS_WORK"
          zip -qr "$RUNNER_TEMP/Football_World_Simulator_V226_ANDROID_FOUNDATION.zip" . \
            -x '.git/*' 'android/.gradle/*' 'android/app/build/*' '**/__pycache__/*' '*.pyc' '.pytest_cache/*'

          SIZE="$(stat -c%s "$RUNNER_TEMP/Football_World_Simulator_V226_ANDROID_FOUNDATION.zip")"
          echo "SOURCE_ZIP_SIZE_BYTES=$SIZE"
          mkdir -p "$RUNNER_TEMP/fws-artifacts"

          if [ "$SIZE" -le 26214400 ]; then
            cp "$RUNNER_TEMP/Football_World_Simulator_V226_ANDROID_FOUNDATION.zip" "$RUNNER_TEMP/fws-artifacts/"
          else
            split -b 23000000 -d -a 2 "$RUNNER_TEMP/Football_World_Simulator_V226_ANDROID_FOUNDATION.zip" "$RUNNER_TEMP/fws-artifacts/Football_World_Simulator_V226_ANDROID_FOUNDATION_PART_"
            for f in "$RUNNER_TEMP"/fws-artifacts/*; do
              case "$f" in
                *.bin) ;;
                *) [ -f "$f" ] && mv "$f" "$f.bin" || true ;;
              esac
            done
            printf '%s\n' 'cat Football_World_Simulator_V226_ANDROID_FOUNDATION_PART_*.bin > Football_World_Simulator_V226_ANDROID_FOUNDATION.zip' > "$RUNNER_TEMP/fws-artifacts/RECOMBINE_SOURCE_ZIP.txt"
          fi

          cp "$APK" "$RUNNER_TEMP/fws-artifacts/"
          cp "$FWS_WORK/android/app/src/main/assets/identity/asset_sources.json" "$RUNNER_TEMP/fws-artifacts/"

      - name: Upload APK, source package and asset audit
        uses: actions/upload-artifact@v4
        with:
          name: FWS-V226-Android-validated
          path: ${{ runner.temp }}/fws-artifacts/*
          if-no-files-found: error
          retention-days: 14
 
