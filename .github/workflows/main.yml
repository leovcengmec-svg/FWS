name: Football World Simulator - CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Setup and Environment Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Show environment
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          pip --version
          pwd
          ls -la

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Validate Python compilation
        run: |
          python -m compileall engine tests

      - name: Run critical tests
        run: |
          pytest -v \
            tests/test_v215_1_match_engine.py \
            tests/test_v220_block11.py \
            tests/test_v221_v225_release.py

      - name: Run full regression
        run: |
          pytest -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
