name: Football World Simulator - V226 Android

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # V225 - REGRESSÃO COMPLETA DO MOTOR OFICIAL
  # ============================================================

  validate-v225:
    name: V225 Core Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate V225 authoritative package
        shell: bash
        run: |
          ZIP="$(find . -type f -name 'Football_World_Simulator_V225_BLOCK12_GITHUB_UPLOAD.zip' -print -quit)"

          test -n "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "V225 package:"
          echo "$ZIP"

      - name: Extract V225 package
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/fws-v225"

          mkdir -p "$RUNNER_TEMP/fws-v225"

          unzip -q "$ZIP" -d "$RUNNER_TEMP/fws-v225"

          ROOT="$(find "$RUNNER_TEMP/fws-v225" \
            -name pytest.ini \
            -type f \
            -print -quit | xargs -r dirname)"

          test -n "$ROOT"

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "V225 project root:"
          echo "$ROOT"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest

      - name: Compile V225 engine and tests
        working-directory: ${{ env.ROOT }}
        run: |
          python -m compileall -q engine tests

      - name: Run complete V225 regression
        working-directory: ${{ env.ROOT }}
        run: |
          pytest -q --junitxml="$RUNNER_TEMP/test-results.xml"

      - name: Upload V225 test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fws-v226-v225-test-results
          path: ${{ runner.temp }}/test-results.xml
          if-no-files-found: error


  # ============================================================
  # V226 - ANDROID
  # ============================================================

  android-build:
    name: Android APK Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Localizar pacote fechado V226
      # ----------------------------------------------------------

      - name: Locate exact V226 Android package
        shell: bash
        run: |
          ZIP="$(find . -type f -name 'Football_World_Simulator_V226_ANDROID_FOUNDATION.zip' -print -quit)"

          test -n "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "V226 package:"
          echo "$ZIP"

      # ----------------------------------------------------------
      # Extrair V226
      # ----------------------------------------------------------

      - name: Extract V226 Android package
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/fws-v226-android"

          mkdir -p "$RUNNER_TEMP/fws-v226-android"

          unzip -q "$ZIP" -d "$RUNNER_TEMP/fws-v226-android"

          ROOT="$(find "$RUNNER_TEMP/fws-v226-android" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)"

          test -n "$ROOT"

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Android project root:"
          echo "$ROOT"

      # ----------------------------------------------------------
      # Java
      # ----------------------------------------------------------

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ----------------------------------------------------------
      # Android SDK
      # ----------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------

      - name: Setup Python 3.11 for Android runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ----------------------------------------------------------
      # Gradle 8.7
      #
      # IMPORTANTE:
      # Não usamos gradle/actions/setup-gradle.
      # O projeto fica dentro de ZIP e não existe Gradle
      # na raiz do repositório.
      # ----------------------------------------------------------

      - name: Download Gradle 8.7
        shell: bash
        run: |
          cd "$RUNNER_TEMP"

          curl -L \
            --fail \
            --retry 3 \
            -o gradle-8.7-bin.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip

          unzip -q gradle-8.7-bin.zip

          test -x "$RUNNER_TEMP/gradle-8.7/bin/gradle"

          echo "GRADLE_HOME=$RUNNER_TEMP/gradle-8.7" >> "$GITHUB_ENV"

          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: |
          gradle --version

      # ----------------------------------------------------------
      # Validar estrutura Android
      # ----------------------------------------------------------

      - name: Validate V226 Android project
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/fws/android/MainActivity.java
          test -f app/src/main/java/com/fws/android/FwsPythonRuntime.java

          test -f app/src/main/python/runtime_api.py

          test -d app/src/main/python/engine

          test -f app/src/main/python/data/global_world_catalog.json

          echo "Android project structure: OK"

      # ----------------------------------------------------------
      # Validar Chaquopy
      # ----------------------------------------------------------

      - name: Validate Chaquopy configuration
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |

          grep -q "com.chaquo.python" build.gradle
          grep -q "com.chaquo.python" app/build.gradle

          echo "Chaquopy configuration: OK"

      # ----------------------------------------------------------
      # Validar identidade visual
      # ----------------------------------------------------------

      - name: Validate identity assets
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |

          CLUBS="$(find app/src/main/assets/identity/clubs \
            -type f \
            -name '*.png' | wc -l)"

          LEAGUES="$(find app/src/main/assets/identity/leagues \
            -type f \
            -name '*.png' | wc -l)"

          COUNTRIES="$(find app/src/main/assets/identity/countries \
            -type f \
            -name '*.png' | wc -l)"

          NATIONAL_TEAMS="$(find app/src/main/assets/identity/national_teams \
            -type f \
            -name '*.png' | wc -l)"

          COMPETITIONS="$(find app/src/main/assets/identity/competitions \
            -type f \
            -name '*.png' | wc -l)"

          CONFEDERATIONS="$(find app/src/main/assets/identity/confederations \
            -type f \
            -name '*.png' | wc -l)"

          EMPTY="$(find app/src/main/assets/identity \
            -type f \
            -name '*.png' \
            -size 0 | wc -l)"

          echo "Club assets: $CLUBS"
          echo "League assets: $LEAGUES"
          echo "Country assets: $COUNTRIES"
          echo "National team assets: $NATIONAL_TEAMS"
          echo "Competition assets: $COMPETITIONS"
          echo "Confederation assets: $CONFEDERATIONS"
          echo "Empty PNG files: $EMPTY"

          test "$CLUBS" -eq 5530
          test "$LEAGUES" -eq 353
          test "$COUNTRIES" -eq 211
          test "$NATIONAL_TEAMS" -eq 211
          test "$COMPETITIONS" -eq 14
          test "$CONFEDERATIONS" -eq 6
          test "$EMPTY" -eq 0

          echo "Identity assets: PASSED"

      # ----------------------------------------------------------
      # Compilar Python do runtime
      # ----------------------------------------------------------

      - name: Compile Android Python runtime
        working-directory: ${{ env.ROOT }}
        run: |
          python -m compileall -q app/src/main/python

      # ----------------------------------------------------------
      # Build APK
      # ----------------------------------------------------------

      - name: Build Android debug APK
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      # ----------------------------------------------------------
      # Verificar APK
      # ----------------------------------------------------------

      - name: Verify APK
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print -quit)"

          test -n "$APK"
          test -s "$APK"

          echo "APK generated successfully:"
          ls -lh "$APK"

      # ----------------------------------------------------------
      # Publicar APK
      # ----------------------------------------------------------

      - name: Upload V226 APK
        uses: actions/upload-artifact@v4
        with:
          name: fws-v226-android-debug-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


  # ============================================================
  # FINAL VALIDATION
  # ============================================================

  final-validation:
    name: Final Validation
    needs:
      - validate-v225
      - android-build

    runs-on: ubuntu-latest

    steps:

      - name: Release gate
        run: |
          echo "======================================"
          echo "FWS V226 RELEASE GATE"
          echo "======================================"
          echo "V225 regression: PASSED"
          echo "Android project validation: PASSED"
          echo "Chaquopy validation: PASSED"
          echo "Identity assets validation: PASSED"
          echo "Android APK build: PASSED"
          echo "======================================"
          echo "V226 FINAL VALIDATION: PASSED"
          echo "======================================"
