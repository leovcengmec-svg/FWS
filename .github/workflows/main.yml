name: Football World Simulator - V226 Android

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. VALIDAR O NÚCLEO V225 DENTRO DO ZIP
  # ============================================================
  validate-v225:
    name: V225 Core Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate FWS ZIP
        run: |
          echo "Procurando ZIP do Football World Simulator..."

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -name "Football_World_Simulator_V226_ANDROID_FOUNDATION.zip" \
            -o -name "Football_World_Simulator_V225_BLOCK12_GITHUB_UPLOAD.zip" \
            -o -name "Football_World_Simulator_V225_BLOCK12.zip" \
            \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: nenhum ZIP FWS encontrado."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract FWS source
        run: |
          rm -rf _fws_source
          mkdir -p _fws_source

          unzip -q "$ZIP_FILE" -d _fws_source

      - name: Locate Python core
        run: |
          PROJECT_ROOT=$(find "$GITHUB_WORKSPACE/_fws_source" \
            -name "pytest.ini" \
            -type f \
            -print -quit \
            | xargs dirname)

          if [ -z "$PROJECT_ROOT" ] || [ ! -f "$PROJECT_ROOT/pytest.ini" ]; then
            echo "ERRO: núcleo Python do FWS não encontrado."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile engine and tests
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          python -m compileall engine tests

      - name: Run V225 regression
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          pytest -v --tb=short --junitxml=test-results.xml

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fws-v225-regression
          path: ${{ env.PROJECT_ROOT }}/test-results.xml
          if-no-files-found: ignore


  # ============================================================
  # 2. BUILD ANDROID
  # ============================================================
  android-build:
    name: Android APK Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          echo "Estrutura do repositório:"
          find . -maxdepth 3 -type f | sort | head -300

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Make Gradle executable
        run: |
          chmod +x gradlew

      - name: Clean Android project
        run: |
          ./gradlew clean

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug

      - name: Locate APK
        run: |
          echo "APKs gerados:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FWS-V226-Android-Debug
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error


  # ============================================================
  # 3. FINAL VALIDATION
  # ============================================================
  final-validation:
    name: V226 Final Validation
    needs:
      - validate-v225
      - android-build

    runs-on: ubuntu-latest

    steps:

      - name: V226 Release Gate
        run: |
          echo "=========================================="
          echo " FOOTBALL WORLD SIMULATOR"
          echo " V226 ANDROID FOUNDATION"
          echo "=========================================="
          echo ""
          echo "V225 CORE: VALIDADO"
          echo "ANDROID BUILD: VALIDADO"
          echo "APK: GERADO"
          echo ""
          echo "V226 FOUNDATION OK"
          echo "=========================================="
