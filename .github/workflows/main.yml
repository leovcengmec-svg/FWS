name: Football World Simulator - V226 Android

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v225:
    name: V225 Core Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate V225 authoritative package
        shell: bash
        run: |
          ZIP="$(find . -type f -name 'Football_World_Simulator_V225_BLOCK12_GITHUB_UPLOAD.zip' -print -quit)"
          test -n "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using V225 package: $ZIP"

      - name: Extract V225 package
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/fws-v225"
          mkdir -p "$RUNNER_TEMP/fws-v225"

          unzip -q "$ZIP" -d "$RUNNER_TEMP/fws-v225"

          ROOT="$(find "$RUNNER_TEMP/fws-v225" -name pytest.ini -type f -print -quit | xargs -r dirname)"

          test -n "$ROOT"

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "V225 project root: $ROOT"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest

      - name: Compile V225 engine and tests
        working-directory: ${{ env.ROOT }}
        run: |
          python -m compileall -q engine tests

      - name: Run complete V225 regression
        working-directory: ${{ env.ROOT }}
        run: |
          pytest -q --junitxml="$RUNNER_TEMP/test-results.xml"

      - name: Upload V225 test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fws-v226-v225-test-results
          path: ${{ runner.temp }}/test-results.xml
          if-no-files-found: error

  android-build:
    name: Android APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate exact V226 Android package
        shell: bash
        run: |
          ZIP="$(find . -type f -name 'Football_World_Simulator_V226_ANDROID_FOUNDATION.zip' -print -quit)"
          test -n "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using V226 Android package: $ZIP"

      - name: Extract V226 Android package
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/fws-v226-android"
          mkdir -p "$RUNNER_TEMP/fws-v226-android"

          unzip -q "$ZIP" -d "$RUNNER_TEMP/fws-v226-android"

          ROOT="$(find "$RUNNER_TEMP/fws-v226-android" -name settings.gradle -type f -print -quit | xargs -r dirname)"

          test -n "$ROOT"

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Android root: $ROOT"

      - name: Setup Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate V226 Android integration and identity assets
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/fws/android/MainActivity.java
          test -f app/src/main/java/com/fws/android/FwsPythonRuntime.java
          test -f app/src/main/python/runtime_api.py
          test -d app/src/main/python/engine
          test -f app/src/main/python/data/global_world_catalog.json

          grep -q "com.chaquo.python" build.gradle
          grep -q "com.chaquo.python" app/build.gradle

          test "$(find app/src/main/assets/identity/clubs -type f -name '*.png' | wc -l)" -eq 5530
          test "$(find app/src/main/assets/identity/leagues -type f -name '*.png' | wc -l)" -eq 353
          test "$(find app/src/main/assets/identity/countries -type f -name '*.png' | wc -l)" -eq 211
          test "$(find app/src/main/assets/identity/national_teams -type f -name '*.png' | wc -l)" -eq 211
          test "$(find app/src/main/assets/identity/competitions -type f -name '*.png' | wc -l)" -eq 14
          test "$(find app/src/main/assets/identity/confederations -type f -name '*.png' | wc -l)" -eq 6

          test "$(find app/src/main/assets/identity -type f -name '*.png' -size 0 | wc -l)" -eq 0

          echo "Identity assets validated:"
          echo "5530 clubs"
          echo "353 leagues"
          echo "211 countries"
          echo "211 national teams"
          echo "14 competitions"
          echo "6 confederations"

      - name: Compile Android Python runtime
        working-directory: ${{ env.ROOT }}
        run: |
          python -m compileall -q app/src/main/python

      - name: Build Android debug APK
        working-directory: ${{ env.ROOT }}
        run: |
          gradle clean assembleDebug --no-daemon

      - name: Verify APK
        working-directory: ${{ env.ROOT }}
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

          test -n "$APK"
          test -s "$APK"

          echo "APK generated:"
          ls -lh "$APK"

      - name: Upload V226 APK
        uses: actions/upload-artifact@v4
        with:
          name: fws-v226-android-debug-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  final-validation:
    name: Final Validation
    needs: [validate-v225, android-build]
    runs-on: ubuntu-latest

    steps:
      - name: Release gate
        run: |
          echo "V226 release gate passed."
          echo "V225 regression: PASSED"
          echo "Android + Python engine bridge: PASSED"
          echo "Identity assets: PASSED"
