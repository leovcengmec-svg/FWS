name: Football World Simulator - V226 Android

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # V225 CORE - REGRESSION
  # ============================================================
  validate-v225:
    name: V225 Core Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate V226 ZIP
        run: |
          echo "Procurando pacote V226..."

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -name "Football_World_Simulator_V226_ANDROID_FOUNDATION.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: ZIP V226 não encontrado."

            echo "Arquivos encontrados:"
            find . -maxdepth 3 -type f | sort

            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V226 source
        run: |
          rm -rf _fws_v226_source
          mkdir -p _fws_v226_source

          echo "Extraindo V226..."

          unzip -q "$ZIP_FILE" -d _fws_v226_source

          echo "Extração concluída."

      - name: Locate Python core
        run: |
          PROJECT_ROOT=$(find "$GITHUB_WORKSPACE/_fws_v226_source" \
            -name "pytest.ini
